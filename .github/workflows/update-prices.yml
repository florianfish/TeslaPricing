name: "Actualisation nocturne des Superchargeurs Tesla"

on:
  schedule:
    # Exécution chaque nuit à 03:00 UTC (04:00 heure française d'hiver, 05:00 d'été)
    - cron: '0 3 * * *'
  # Permet également de lancer manuellement la mise à jour depuis l'onglet Actions de GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour autoriser le commit et le push sur le dépôt

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Installer OpenVPN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openvpn openvpn-systemd-resolved

      - name: Préparer le fichier de configuration OpenVPN
        env:
          OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}
        run: |
          echo "$OVPN_CONFIG" | base64 -d > /tmp/vpn.ovpn 2>/dev/null \
            || echo "$OVPN_CONFIG" > /tmp/vpn.ovpn
          echo "✅ Fichier VPN prêt ($(wc -l < /tmp/vpn.ovpn) lignes)"

      - name: Connexion au VPN résidentiel (OpenVPN)
        timeout-minutes: 3
        env:
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          CONF=/tmp/vpn.ovpn
          # Fins de ligne Windows (CRLF) -> LF
          sed -i 's/\r$//' "$CONF"

          # Identifiants : on remplace toute directive auth-user-pass existante
          if [ -n "$VPN_USERNAME" ]; then
            printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" > /tmp/vpn-auth.txt
            chmod 600 /tmp/vpn-auth.txt
            sed -i '/^[[:space:]]*auth-user-pass/d' "$CONF"
            echo "auth-user-pass /tmp/vpn-auth.txt" >> "$CONF"
          fi

          sudo openvpn --config "$CONF" --daemon \
            --log /tmp/openvpn.log --writepid /tmp/openvpn.pid

          for i in $(seq 1 60); do
            if sudo grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
              echo "✅ VPN connecté"
              exit 0
            fi
            if [ -f /tmp/openvpn.pid ] && ! sudo kill -0 "$(sudo cat /tmp/openvpn.pid)" 2>/dev/null; then
              echo "❌ Le processus OpenVPN s'est arrêté"
              break
            fi
            sleep 2
          done
          echo "❌ Échec de connexion VPN — journal OpenVPN :"
          sudo cat /tmp/openvpn.log
          exit 1

      - name: Vérifier l'IP de sortie et la connectivité Tesla
        run: |
          echo "=== IP publique du runner ==="
          curl -s --max-time 10 https://api.ipify.org && echo ""
          echo ""
          echo "=== Test connectivité Tesla API ==="
          curl -s --max-time 10 -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            "https://www.tesla.com/api/findus/get-charger-details?locationSlug=parissupercharger&programType=supercharger&locale=en-US&isInHkMoTw=false" \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            || echo "Tesla API injoignable"

      - name: Exécuter le script d'actualisation des stations et prix
        run: npm run update-prices

      - name: Commiter et pousser les modifications sur GitHub
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): actualisation automatique nocturne des Superchargeurs"
          file_pattern: "server/data/superchargers_db.json server/data/out_stations.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Notifier et synchroniser le VPS
        if: steps.auto_commit.outputs.changes_detected == 'true'
        env:
          TARGET_URL: ${{ secrets.VPS_WEBHOOK_URL || secrets.VPS_SYNC_WEBHOOK_URL || secrets.VPS_URL || secrets.WEBHOOK_URL }}
        run: |
          if [ -n "$TARGET_URL" ]; then
            echo "Envoi de la base actualisée vers le VPS..."
            curl -s -X POST \
              -H "Content-Type: application/json" \
              --data-binary @server/data/superchargers_db.json \
              "$TARGET_URL" || echo "VPS non joignable actuellement"
          else
            echo "Aucune URL de webhook configurée, étape ignorée."
          fi

      - name: Déconnexion du VPN
        if: always()
        run: |
          if [ -f /tmp/openvpn.pid ]; then
            sudo kill "$(sudo cat /tmp/openvpn.pid)" 2>/dev/null || true
          fi
          rm -f /tmp/vpn-auth.txt /tmp/vpn.ovpn
