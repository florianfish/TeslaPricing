name: "Actualisation nocturne des Superchargeurs Tesla"

on:
  schedule:
    # Exécution chaque nuit à 03:00 UTC (04:00 heure française d'hiver, 05:00 d'été)
    - cron: '0 3 * * *'
  # Permet également de lancer manuellement la mise à jour depuis l'onglet Actions de GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour autoriser le commit et le push sur le dépôt

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Exécuter le script d'actualisation des stations et prix
        env:
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME || 'FlorianFish5' }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: npm run update-prices

      - name: Commiter et pousser les modifications sur GitHub
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): actualisation automatique nocturne des Superchargeurs"
          file_pattern: "server/data/superchargers_db.json server/data/out_stations.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Notifier et synchroniser le VPS
        if: steps.auto_commit.outputs.changes_detected == 'true'
        env:
          TARGET_URL: ${{ secrets.VPS_WEBHOOK_URL || secrets.VPS_SYNC_WEBHOOK_URL || secrets.VPS_URL || secrets.WEBHOOK_URL }}
        run: |
          if [ -n "$TARGET_URL" ]; then
            echo "Envoi de la base actualisée vers le VPS..."
            curl -s -X POST \
              -H "Content-Type: application/json" \
              --data-binary @server/data/superchargers_db.json \
              "$TARGET_URL" || echo "VPS non joignable actuellement"
          else
            echo "Aucune URL de webhook configurée, étape ignorée."
          fi
