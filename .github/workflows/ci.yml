name: "Tests"

on:
  push:
    branches: [main]
    # Les commits nocturnes ne touchent que la base : les tests utilisent leur propre jeu de données
    paths-ignore:
      - 'server/data/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Typage (lint)
        run: npm run lint

      - name: Tests unitaires et API (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Tests navigateur (Playwright)
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Image de l'add-on : construite et démarrée comme dans Home Assistant (DATA_DIR=/data)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: teslapricing:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer et vérifier le conteneur
        run: |
          mkdir -p data && cp tests/fixtures/superchargers_db.json data/ && chmod -R 777 data
          docker run -d --name tp -p 3000:3000 -e DATA_DIR=/data -e STATION_SYNC=0 -v "$PWD/data:/data" teslapricing:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/api/health
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
          test "$(curl -s http://localhost:3000/api/prices/stats | jq .totalStations)" = "5"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/prices/import)" = "403"

      - name: Journal du conteneur
        if: always()
        run: docker logs tp || true
