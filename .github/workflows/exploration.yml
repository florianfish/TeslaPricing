name: "Exploration (temporaire)"
on:
  push:
    branches: [test/exploration]
permissions:
  contents: read
jobs:
  occupation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/occupation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Échantillon réel (rapprochement + relevé)
        run: |
          mkdir -p /tmp/data && cp server/data/superchargers_db.json /tmp/data/
          cat > /tmp/run.ts <<'TS'
          import { sampleOccupancy, getOccupancy, loadOccupancyStore } from './server/occupancy.ts';
          const t0 = Date.now();
          const r = await sampleOccupancy();
          const s = loadOccupancyStore();
          console.log('durée', Date.now() - t0, 'ms ; stations échantillonnées', r.stations, '; rapprochées', Object.keys(s.mapping).length);
          const counts = Object.values(s.current).map((c: any) => `${c.occupied}/${c.total}`);
          console.log('exemples', counts.slice(0, 15).join(' '));
          for (const id of ['10338', '8033', '10341']) console.log(id, JSON.stringify({ ...getOccupancy(id), grid: undefined }));
          TS
          cp /tmp/run.ts ./run-occupancy.ts
          DATA_DIR=/tmp/data npx tsx run-occupancy.ts
          ls -la /tmp/data
