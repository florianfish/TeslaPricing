services:
  teslapricing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesla-pricing
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # ID de mesure Google Analytics 4 (facultatif, vide = suivi désactivé)
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID:-}
    volumes:
      # Persistance de la base de données JSON sur l'hôte VPS
      # Conserve l'historique des prix et nouveaux relevés entre les redémarrages
      - ./server/data:/app/server/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: tesla-pricing-net
