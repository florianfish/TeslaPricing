network:
  3000/tcp: Port de l'interface web pour un accès direct (laisser vide pour n'utiliser que la barre latérale Home Assistant)
configuration:
  occupancy_interval_min:
    name: Occupation des stations (minutes)
    description: Intervalle de relevé de l'occupation des bornes Tesla d'après les données publiques IRVE (transport.data.gouv.fr), pour afficher l'affluence et la meilleure heure dans la fiche station. 0 pour désactiver.
  import_key:
    name: Clé d'import
    description: Clé partagée avec l'extension navigateur « Collecteur Tesla » pour importer les tarifs. Laisser vide pour désactiver l'import.
  ga_measurement_id:
    name: ID de mesure Google Analytics
    description: ID de mesure Google Analytics 4 (G-XXXXXXXXXX) pour suivre la fréquentation de l'interface. Laisser vide pour désactiver le suivi.
  public_url:
    name: URL publique
    description: Adresse publique du site (ex. https://suc.exemple.fr) si l'interface est exposée sur Internet. Active le référencement (pages station, sitemap, aperçus de partage). Laisser vide pour une instance privée, non indexée.
  telegram_bot_token:
    name: Token du bot Telegram
    description: Jeton API fourni par @BotFather pour recevoir les alertes d'évolution des stations.
  telegram_chat_id:
    name: Chat ID Telegram
    description: Identifiant du destinataire (utilisateur, groupe ou canal) pour les notifications.
  android_cert_sha256:
    name: Empreintes de l'appli Android
    description: Empreintes SHA-256 des clés de signature de l'appli Android (debug et release, séparées par des virgules), publiées dans /.well-known/assetlinks.json. Sans elles, l'appli affiche une barre d'adresse.
  teslamate_api_url:
    name: Adresse de TeslaMate API
    description: Adresse de votre TeslaMate API (teslamateapi, ou celle fournie par MyTeslaMate), pour l'onglet « Mes recharges » qui compare vos factures Superchargeur aux tarifs relevés. Onglet visible seulement depuis Home Assistant. Laisser vide pour désactiver.
  teslamate_api_token:
    name: Jeton de TeslaMate API
    description: Jeton d'accès à TeslaMate API (en-tête Authorization Bearer), si votre instance en demande un.
  teslamate_car_id:
    name: Numéro de la voiture dans TeslaMate
    description: Identifiant TeslaMate de la voiture (1 pour la première).
