network:
  3000/tcp: Web UI port for direct access (leave empty to only use the Home Assistant sidebar)
configuration:
  import_key:
    name: Import key
    description: Key shared with the "Collecteur Tesla" browser extension to import prices. Leave empty to disable importing.
  ga_measurement_id:
    name: Google Analytics measurement ID
    description: Google Analytics 4 measurement ID (G-XXXXXXXXXX) to track web UI visits. Leave empty to disable tracking.
  public_url:
    name: Public URL
    description: Public address of the site (e.g. https://suc.example.com) when the web UI is exposed on the Internet. Enables search engine indexing (station pages, sitemap, link previews). Leave empty for a private, non-indexed instance.
  telegram_bot_token:
    name: Telegram bot token
    description: API token provided by @BotFather to receive station evolution alerts.
  telegram_chat_id:
    name: Telegram chat ID
    description: Recipient chat ID (user, group or channel) for notifications.
